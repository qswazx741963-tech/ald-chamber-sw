; ALD Chamber 韌體：一個 PlatformIO 專案、四個 env（一塊板一個）
; 編譯：pio run -e board1_process
; 燒錄：pio run -e board1_process -t upload --upload-port COMx
; TODO 板子型號確認後修改 board（目前假設 Arduino Mega 2560）

[platformio]
default_envs = board1_process, board2_heater, board3_vacuum, board4_motion

[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps =
    cmb27/ModbusRTUSlave@^2.0.6
build_flags =
    -D MODBUS_BAUD=115200
    -D RS485_DE_PIN=2          ; TODO RS-485 收發器 DE/RE 腳位
    -Wall

[env:board1_process]
build_src_filter = +<board1_process/>
build_flags = ${env.build_flags}
    -D ALD_BOARD_HEADER='"registers_board1_process.h"'

[env:board2_heater]
build_src_filter = +<board2_heater/>
build_flags = ${env.build_flags}
    -D ALD_BOARD_HEADER='"registers_board2_heater.h"'

[env:board3_vacuum]
build_src_filter = +<board3_vacuum/>
build_flags = ${env.build_flags}
    -D ALD_BOARD_HEADER='"registers_board3_vacuum.h"'

[env:board4_motion]
build_src_filter = +<board4_motion/>
build_flags = ${env.build_flags}
    -D ALD_BOARD_HEADER='"registers_board4_motion.h"'
